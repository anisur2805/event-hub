<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="iaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#ibg)"/>

  <!-- calendar body -->
  <rect x="46" y="64" width="164" height="140" rx="18" fill="#4338ca"/>
  <!-- header band -->
  <rect x="46" y="64" width="164" height="34" rx="17" fill="#6366f1"/>
  <rect x="46" y="84" width="164" height="14" fill="#6366f1"/>
  <!-- binder rings -->
  <rect x="76" y="46" width="12" height="34" rx="6" fill="#fbbf24"/>
  <rect x="168" y="46" width="12" height="34" rx="6" fill="#fbbf24"/>
  <!-- filled cell + check: the confirmed seat -->
  <rect x="70" y="116" width="52" height="34" rx="7" fill="url(#iaccent)"/>
  <path d="M84 133 l10 10 l18 -20" stroke="#1e1b4b" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- empty cells -->
  <g fill="#5b54ee">
    <rect x="134" y="116" width="52" height="34" rx="7"/>
    <rect x="70" y="158" width="52" height="34" rx="7"/>
    <rect x="134" y="158" width="52" height="34" rx="7"/>
  </g>
</svg>
